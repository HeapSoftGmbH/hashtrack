name: Check and Publish

on:
  push:
    branches: ['**']
    tags: ['*-v*']
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: install
        run: bun install --frozen-lockfile

      # - name: audit
      #   run: bun audit

      - name: format
        run: bun format:check

      - name: lint
        run: bun lint

      # every published package ships only dist/, so a broken bundle
      # must fail before the release tag
      - name: build pi extension
        run: bun run build:pi

      - name: build opencode plugin
        run: bun run build:opencode

      - name: build claude plugin
        run: bun run build:claude

      # after the builds, so a broken bundle and a broken test fail the same run
      - name: test
        run: bun test:extensions && bun test:web

      # the Claude plugin's UI module (hooks/*.test.tsx) runs in Claude Code's
      # own test kit, not bun test; pinned like the other tools. Needs no login.
      - name: test claude plugin UI
        run: bunx @anthropic-ai/claude-code@2.1.311 plugin test apps/claude

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org

      - name: install
        run: bun install --frozen-lockfile

      # <app>-v<version> selects apps/<app>: @hashtrack/pi, @hashtrack/opencode and @hashtrack/claude share this job
      - name: resolve tag
        run: |
          APP="${GITHUB_REF_NAME%-v*}"
          VERSION="${GITHUB_REF_NAME##*-v}"
          test -d "apps/$APP" || { echo "apps/$APP not found"; exit 1; }
          echo "app=$APP" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_ENV"
          echo "pkg=$(jq -r .name "apps/$APP/package.json")" >> "$GITHUB_ENV"

      - name: build release notes
        id: changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b
        with:
          mode: COMMIT
          configurationJson: |
            {
              "template":
                "## ${{ env.pkg }} v${{ env.version }}\n\n#{{UNCATEGORIZED}}",
              "commit_template": "- #{{TITLE}}",
              "categories": [],
              "tag_resolver": {
                "method": "semver",
                "filter": {
                  "pattern": "^${{ env.app }}-v(.+)$",
                  "flags": "gu"
                },
                "transformer": {
                  "pattern": "^${{ env.app }}-v(.+)$",
                  "target": "$1"
                }
              }
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: create github release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          name: "${{ env.pkg }} v${{ env.version }}"
          body: ${{ steps.changelog.outputs.changelog }}

      # scoped packages publish as private unless access is set explicitly
      - name: publish
        working-directory: apps/${{ env.app }}
        run: npm publish --access public
